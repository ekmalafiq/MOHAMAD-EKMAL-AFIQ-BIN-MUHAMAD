<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Transparent or White Background -->
  <rect width="400" height="400" fill="#ffffff" rx="16" />

  <g transform="translate(0, 15)">
    <!-- Red Hexagon Outer Shield -->
    <!-- Point at top (200, 32) and bottom (200, 238) -->
    <polygon
      points="200,32 290,84 290,186 200,238 110,186 110,84"
      fill="none"
      stroke="#E31B23"
      stroke-width="19"
      stroke-linejoin="miter"
      stroke-miterlimit="10"
    />

    <!-- Inner Symbol: Stylized Monogram U Shield -->
    <path
      d="M 136 94
         L 156 82
         L 156 166
         L 200 192
         L 244 166
         L 244 82
         L 264 94
         L 264 178
         L 200 216
         L 136 178
         Z"
      fill="#1A1A1A"
    />

    <!-- Central Pillar Element -->
    <polygon
      points="200,70 224,84 224,154 200,168 176,154 176,84"
      fill="#1A1A1A"
    />

    <!-- Typography: UNICRON in Forest Green -->
    <text
      x="200"
      y="288"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="44"
      fill="#005A36"
      text-anchor="middle"
      letter-spacing="2"
    >UNICRON</text>

    <!-- Typography: HOLDINGS in Warm Bronze -->
    <text
      x="200"
      y="318"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-weight="700"
      font-size="16"
      fill="#8C5828"
      text-anchor="middle"
      letter-spacing="9"
    >HOLDINGS</text>
  </g>
</svg>
